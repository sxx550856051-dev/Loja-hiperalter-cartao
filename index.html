<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Pontos Hiperalter</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            margin: 0;
            color: #224470;
        }
        .qr-box {
            margin: 30px auto;
        }
        canvas {
            border: 8px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000020;
        }
        .aviso {
            color: #333333;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h3>O Seu Cartão de Pontos Único - HiperAlter</h3>
    <div class="qr-box" id="qrcode"></div>
    <p>🔽 Mantenha o dedo pressionado na imagem para guardar no telemóvel</p>
    <p class="aviso">
        Aviso: Este cartão usa apenas um código único.<br>
        Não recolhemos o seu nome ou número de telemóvel.<br>
        Se perder esta imagem, os pontos acumulados não poderão ser recuperados. -HiperAlter 郑.Shike
    </p>

    <script>
        const unicoID = crypto.randomUUID();
        // ====== 最终确定地址 ======
        const linkNossaVerificacao = "https://cartao-hiperalter/vip?uid=" + unicoID;

        QRCode.toCanvas(linkNossaVerificacao, {
            width: 320,
            margin: 2
        }, function (erro, canvas) {
            if (erro) console.error(erro);
            document.getElementById("qrcode").appendChild(canvas);
        });
    </script>
</body>
</html>
